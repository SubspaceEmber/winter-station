- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: television set
  id: ComputerTelevision
  description: It's TV time!
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Machines/television.rsi
    drawdepth: SmallObjects
    offset: 0,0.1
    layers:          
    - state: icon
    - state: panel
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: PlaceableSurface
    placeCentered: true
    positionOffset: 0, 0.2 # todo need to figure out how to push it back for tables
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b89f25" # todo make this dependent on what's on screen
  - type: Machine
    board: TelevisionCircuitboard
  - type: UserInterface
    interfaces:
      enum.TelevisionUiKey.Key:
        type: TelevisionBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 200
        mask:
          - TabletopMachineMask
        layer:
          - TabletopMachineLayer
